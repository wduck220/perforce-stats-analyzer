spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.template.reply-timeout=100000

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=/app/certs/keystore.p12
server.ssl.key-store-password=${resolved.ssl.keystore.password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dashboard

perforce.host=${PERFORCE_HOST}
perforce.port=${PERFORCE_PORT:1666}
perforce.user=${PERFORCE_USER}
perforce.password=${PERFORCE_PASSWORD}

perforce.trigger.script.path=${PERFORCE_TRIGGER_SCRIPT_PATH:/opt/perforce-triggers/perforce_notify_handler.py}
perforce.trigger.secret=${PERFORCE_TRIGGER_SECRET:}

server.public.host=${SERVER_PUBLIC_HOST:localhost}

perforce.ssh.host=${PERFORCE_SSH_HOST}
perforce.ssh.port=${PERFORCE_SSH_PORT:22}
perforce.ssh.user=${PERFORCE_SSH_USER}
perforce.ssh.password=${PERFORCE_SSH_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

report.email.recipient=${REPORT_EMAIL_RECIPIENT:}
report.dashboard.url=${REPORT_DASHBOARD_URL:http://localhost:8080/index.html}
report.sync.interval.ms=${resolved.report.sync.interval.ms}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/perforce_analytics}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
